services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arabic
      POSTGRES_USER: arabic
      POSTGRES_PASSWORD: arabic
    ports:
      - "54329:5432"
    volumes:
      - arabic_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arabic -d arabic"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  arabic_postgres_data:
